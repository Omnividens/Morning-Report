name: Päivitä aamukatsaus

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: aamukatsaus
  cancel-in-progress: false

jobs:
  paivita:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Hae koodi
        uses: actions/checkout@v4

      - name: Rakenna sivu
        run: python3 build.py

      - name: Paketoi sivu
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Julkaise sivu
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Pidä ajastus hengissä
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > viimeisin_ajo.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add viimeisin_ajo.txt
          git commit -m "Päivitä ajon aikaleima"
          git push
